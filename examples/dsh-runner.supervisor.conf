; Runner service for DSH-shellout. Start it before the host that uses it.
[program:dsh-runner]
command=/path/to/dsh --profile shellout-runner
directory=/path/to/harness
environment=HOME="/root",USER="root"
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/dsh-runner.log
